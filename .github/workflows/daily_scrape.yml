name: Daily Pool Scrape

on:
  schedule:
    - cron: '0 4 * * *' # Run at 4 AM UTC every day
  workflow_dispatch: # Allow manual trigger

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to push changes

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Ollama (LLM local, sans clé API)
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:11434/api/version && break
            sleep 2
          done

      - name: Cache des modèles Ollama
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-gemma3-1b

      - name: Télécharger le modèle
        run: ollama pull gemma3:1b

      - name: Run scraper
        env:
          LLM_MODEL: gemma3:1b
        run: python scripts/scrape_pools.py

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add site/piscines_paris.geojson
          # Only commit if there are changes
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update pool data" && git push)
